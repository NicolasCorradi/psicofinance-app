services:
  - type: web
    name: psicofinance-backend
    runtime: python
    rootDir: psicofinance-backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: INFLACION_MENSUAL
        value: "0.05"
      - key: MONOTRIBUTO_CATEGORIA
        value: D
      - key: MONOTRIBUTO_TOPE_ANUAL
        value: "16450000"
      - key: MONOTRIBUTO_UMBRAL_AMARILLO
        value: "0.80"
      - key: ALLOWED_ORIGINS
        sync: false
